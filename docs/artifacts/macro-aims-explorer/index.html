}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Sans 3",system-ui,sans-serif;padding-inline:16px;padding-block:28px;}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;font-weight:700;text-wrap:balance;}
.wrap{max-width:920px;margin:0 auto;}
header.top{margin-bottom:28px;}
header.top h1{font-size:clamp(28px,5vw,42px);margin:0 0 6px;}
header.top p{color:var(--ink-dim);margin:0;font-size:15px;max-width:60ch;}

.tabbar{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:8px;z-index:5;}

.tab[aria-selected="true"]{background:var(--dot,var(--accent));color:#fff;border-color:transparent;}

section.obj{display:none;border:1px solid var(--border);border-radius:16px;background:var(--surface);padding:22px 20px;margin-bottom:16px;}
section.obj.active{display:block;}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-dim);font-weight:700;margin-bottom:6px;}
.dotchip{width:10px;height:10px;border-radius:50%;background:var(--dot);}
.obj h2{font-size:26px;margin:0 0 10px;}
.def{font-size:16px;line-height:1.55;background:var(--surface2);border-left:4px solid var(--dot);padding:12px 14px;border-radius:8px;margin:0 0 18px;}

.kw dt{font-weight:700;font-size:14px;margin-bottom:3px;color:var(--dot);}
.kw dd{margin:0;font-size:13.5px;line-height:1.45;color:var(--ink);}

.chart-box{background:var(--surface2);border-radius:12px;padding:14px;}
.chart-box svg{width:100%;height:auto;display:block;}
.chart-controls{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.chart-controls button{font-family:inherit;font-size:12px;border:1px solid var(--border);background:var(--surface);color:var(--ink);padding:5px 10px;border-radius:7px;cursor:pointer;}
.chart-controls button[aria-pressed="true"]{background:var(--dot);color:#fff;border-color:transparent;}
.chart-caption{font-size:12px;color:var(--ink-dim);margin-top:8px;}
.tick text, .axis text{font-size:10px;fill:var(--ink-dim);font-family:inherit;}
.gridline{stroke:var(--border);stroke-width:1;}

details.q{background:var(--surface2);border-radius:10px;padding:10px 14px;margin-bottom:8px;}

details.q .meta{font-size:11px;color:var(--ink-dim);font-weight:500;margin-left:6px;}
details.q .ans{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);font-size:14px;line-height:1.5;}

<header class="top">
  <h1>The Four&#8202;+&#8202;Two Aims</h1>
  <p>GCSE Economics, Chapter 25 &mdash; the macroeconomic objectives every UK government juggles at once, why they matter, and why hitting one often means missing another.</p>
</header>

const panels = document.getElementById("panels");
const tabbar = document.getElementById("tabbar");

OBJECTIVES.forEach((o,i)=>{
  const tab = document.createElement("button");
  tab.className="tab"; tab.textContent=o.label; tab.setAttribute("role","tab");
  tab.setAttribute("aria-selected", i===0 ? "true":"false");
  tab.style.setProperty("--dot", o.color);
  tab.addEventListener("click",()=>selectTab(o.id));
  tabbar.appendChild(tab);

  const sec = document.createElement("section");
  sec.className="obj"+(i===0?" active":"");
  sec.id="panel-"+o.id;
  sec.style.setProperty("--dot", o.color);
  sec.innerHTML = `
    <span class="eyebrow"><span class="dotchip"></span>Objective ${i+1} of 6</span>
    <h2>${o.title}</h2>
    <p class="def">${o.def}</p>

    <h3 class="block">Key words in a UK context</h3>
    <dl class="kw-grid">
      ${o.keywords.map(k=>`<div class="kw"><dt>${k[0]}</dt><dd>${k[1]}</dd></div>`).join("")}
    </dl>

    <h3 class="block">Explore the data</h3>
    <div class="chart-box" data-chart="${o.chart}"></div>

    <h3 class="block">Exam-style questions</h3>
    ${o.questions.map(qq=>`<details class="q"><summary>${qq.q}${qq.meta?`<span class="meta">${qq.meta}</span>`:""}</summary><div class="ans"><strong>Model answer / mark scheme guide:</strong> ${qq.a}</div></details>`).join("")}

    <h3 class="block">Where this conflicts with other aims</h3>
    ${o.conflicts.map(c=>`<div class="conflict"><span class="vs">vs ${c[0]}</span><p>${c[1]}</p></div>`).join("")}

    <h3 class="block">Worth knowing</h3>
    ${o.facts.map(f=>`<div class="fact">${f}</div>`).join("")}
  `;
  panels.appendChild(sec);
});

function selectTab(id){
  document.querySelectorAll(".tab").forEach((t,i)=>t.setAttribute("aria-selected", OBJECTIVES[i].id===id ? "true":"false"));
  document.querySelectorAll("section.obj").forEach(s=>s.classList.toggle("active", s.id==="panel-"+id));
  renderChart(id);
}

const DATA = {
  growth:{unit:"% real GDP growth", years:[2015,2016,2017,2018,2019,2020,2021,2022,2023,2024], values:[2.4,2.2,2.4,1.7,1.6,-10.4,8.7,4.8,0.6,1.1], series:"UK real GDP growth"},
  unemployment:{unit:"% unemployment rate", years:[2015,2016,2017,2018,2019,2020,2021,2022,2023,2024], values:[5.4,4.9,4.4,4.1,3.8,4.6,4.5,3.7,4.0,4.3], series:"UK ILO unemployment rate"},
  inflation:{unit:"% CPI inflation", years:[2015,2016,2017,2018,2019,2020,2021,2022,2023,2024], values:[0.0,0.7,2.7,2.5,1.8,0.9,2.6,9.1,7.3,2.5], series:"UK CPI inflation", target:2},
  bop:{unit:"£bn current account balance", years:[2015,2016,2017,2018,2019,2020,2021,2022,2023,2024], values:[-98,-104,-77,-75,-58,-40,-46,-84,-21,-30], series:"UK current account balance"},
  distribution:{unit:"Gini coefficient (x100)", years:[2015,2016,2017,2018,2019,2020,2021,2022,2023,2024], values:[33,33,34,34,34,32,32,35,34,34], series:"UK income Gini coefficient"},
  environment:{unit:"MtCO2e greenhouse gas emissions", years:[2015,2016,2017,2018,2019,2020,2021,2022,2023,2024], values:[497,474,464,451,435,364,425,406,384,371], series:"UK territorial emissions"}
};

const rendered = {};
function renderChart(id){
  const box = document.querySelector(`section#panel-${id} .chart-box`);
  if(!box || rendered[id]) return;
  rendered[id]=true;
  const d = DATA[id];
  const W=680,H=280,padL=46,padR=16,padT=16,padB=30;
  const innerW=W-padL-padR, innerH=H-padT-padB;
  const min = Math.min(0, ...d.values), max = Math.max(...d.values);
  const range = (max-min)||1;
  const x = i => padL + (i/(d.years.length-1))*innerW;
  const y = v => padT + innerH - ((v-min)/range)*innerH;
  const zeroY = y(0);

  let gridlines="", labels="";
  const steps=4;
  for(let s=0;s<=steps;s++){
    const val = min + (range/steps)*s;
    const yy = y(val);
    gridlines += `<line class="gridline" x1="${padL}" x2="${W-padR}" y1="${yy}" y2="${yy}"/>`;
    labels += `<text class="axis" x="${padL-8}" y="${yy+3}" text-anchor="end">${val.toFixed(1)}</text>`;
  }
  let xlabels="";
  d.years.forEach((yr,i)=>{
    if(i%2===0 || i===d.years.length-1) xlabels += `<text class="axis" x="${x(i)}" y="${H-8}" text-anchor="middle">${yr}</text>`;
  });

  const points = d.values.map((v,i)=>`${x(i)},${y(v)}`).join(" ");
  const areaPath = `M${x(0)},${zeroY} ` + d.values.map((v,i)=>`L${x(i)},${y(v)}`).join(" ") + ` L${x(d.values.length-1)},${zeroY} Z`;

  let targetLine="";
  if(d.target!==undefined){
    const ty=y(d.target);
    targetLine = `<line x1="${padL}" x2="${W-padR}" y1="${ty}" y2="${ty}" stroke="var(--dot)" stroke-dasharray="4 3" stroke-width="1.5"/><text class="axis" x="${W-padR}" y="${ty-4}" text-anchor="end" fill="var(--dot)">2% target</text>`;
  }

  const dots = d.values.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="var(--dot)"><title>${d.years[i]}: ${v}${id==="bop"?"":"%"}</title></circle>`).join("");

  box.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${d.series} chart">
      ${gridlines}
      <line class="gridline" x1="${padL}" x2="${W-padR}" y1="${zeroY}" y2="${zeroY}" stroke-width="1.4"/>
      <path d="${areaPath}" fill="var(--dot)" opacity="0.12" stroke="none"/>
      <polyline points="${points}" fill="none" stroke="var(--dot)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
      ${targetLine}
      ${dots}
      ${labels}${xlabels}
    </svg>
    <p class="chart-caption">${d.series}, ${d.years[0]}&ndash;${d.years[d.years.length-1]} (illustrative UK figures, ${d.unit}). Hover a point for the exact value.</p>
  `;
}

renderChart(OBJECTIVES[0].id);
</script>
